<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협성대 캠퍼스 투어 3D</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --navy: #1f2a83; --line: #e6e6e6; --text: #222; --muted: #666; --accent: #ffb400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; color: var(--text); font: 15px/1.45 system-ui, "Malgun Gothic", sans-serif; }
  main { width: min(100%, 1320px, calc((100vh - 130px) * 1.483 + 560px)); margin: 0 auto; padding: 20px 24px; }
  h1 { margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-size: 28px; }
  #tour { display: flex; align-items: stretch; }
  #map { position: relative; flex: 709 1 0; min-width: 0; aspect-ratio: 709 / 478; overflow: hidden; background: #a0dfe9; }
  #map canvas { display: block; width: 100%; height: 100%; }
  #legend { flex: 495 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 24px 28px; background: #fafafa; border: 1px solid #ececec; border-left: 0; }
  #brand { text-align: center; color: #666; }
  #brand strong { display: block; font-size: 30px; letter-spacing: -.02em; }
  #brand span { font-size: 13px; letter-spacing: .04em; }
  #items { display: grid; grid-template-rows: repeat(6, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px 6px; margin: 0; padding: 0; list-style: none; }
  #items button { display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 4px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #items button:hover { background: #eef0fa; }
  #items button.on { background: #fff1cc; }
  .num { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 13px; }
  #home { align-self: center; padding: 7px 16px; border: 1px solid var(--navy); border-radius: 6px; background: #fff; color: var(--navy); font: inherit; cursor: pointer; }
  #home:hover { background: var(--navy); color: #fff; }
  #note { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  .marker { position: absolute; left: 0; top: 0; display: grid; place-items: center; width: 2.9%; aspect-ratio: 1; padding: 0; border: 2px solid #fff; border-radius: 50%; background: var(--navy); color: #fff; font: 500 clamp(9px, 1.05vw, 14px)/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  .marker.on { background: var(--accent); color: #1a1a1a; }
  #locate { position: absolute; left: 12px; bottom: 12px; padding: 9px 14px; border: 0; border-radius: 999px; background: #fff; color: var(--navy); font: 600 14px/1 system-ui, "Malgun Gothic", sans-serif; cursor: pointer; box-shadow: 0 1px 5px rgba(0, 0, 0, .35); }
  #locate.on { background: var(--navy); color: #fff; }
  #gps-status { position: absolute; left: 12px; bottom: 56px; max-width: calc(100% - 24px); margin: 0; padding: 6px 10px; border-radius: 7px; background: rgba(20, 26, 40, .86); color: #fff; font-size: 13px; }
  #gps-status[hidden] { display: none; }
  #error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: #20262b; color: #fff; text-align: center; }
  #error[hidden] { display: none; }
  body.compare main { width: 100%; padding: 0; }
  body.compare h1, body.compare #legend, body.compare #note { display: none; }
  @media (max-width: 860px) {
    main { width: 100%; padding: 12px 12px; }
    h1 { margin-bottom: 8px; padding-bottom: 8px; font-size: 20px; }
    #tour { display: block; }
    #map { aspect-ratio: auto; height: 68vh; height: 68svh; }
    .marker { width: 22px; font-size: 11px; }
    #legend { border-left: 1px solid #ececec; border-top: 0; padding: 18px 14px; }
    #items { grid-template-rows: repeat(9, auto); }
  }
</style>
</head>
<body>
<main>
  <h1>캠퍼스 투어</h1>
  <div id="tour">
    <div id="map">
      <div id="error" hidden></div>
      <p id="gps-status" role="status" hidden></p>
      <button id="locate" type="button">내 위치</button>
    </div>
    <aside id="legend">
      <div id="brand"><strong>협성대학교</strong><span>HYUPSUNG UNIVERSITY</span></div>
      <ol id="items"></ol>
      <button id="home" type="button">전체 보기</button>
    </aside>
  </div>
  <p id="note">드래그로 돌리기 · 오른쪽 드래그로 옮기기 · 휠로 확대 · 번호나 건물을 누르면 이동합니다. 학교 캠퍼스 안내도의 배치를 눈으로 보고 대략 만든 비공식 3D 모형이며 실측 자료가 아닙니다. 내 위치는 실제 좌표를 그림에 맞춘 근사치입니다. 위치 기준 자료 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap 기여자</a> (ODbL) · 국토교통부 브이월드 (공공누리 제1유형)</p>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 모든 좌표는 안내도 그림의 픽셀(709 x 478)로 적고, 그림과 같은 시점의 카메라로 3D에 투영한다.
const FRAME = { w: 709, h: 478 };
const FOV = 26, PITCH = THREE.MathUtils.degToRad(36), DIST = 930;
const U0 = -300, U1 = 1010, V0 = -170, V1 = 900, TEX_SCALE = matchMedia('(pointer: coarse)').matches ? 2 : 3;

const PLACES = [
  [1, '인문사회관', 72, 259], [2, '본관', 121, 222], [3, '글로벌경영관', 184, 197], [4, '국제교류센터', 269, 196],
  [5, '중앙도서관', 318, 254], [6, '웨슬리창의융합관(교양관)', 319, 174], [7, '예술관', 337, 44], [8, '산학협력관', 248, 26],
  [9, '제1생활관', 173, 59], [10, '이공관', 207, 122], [11, '예술대실습관', 114, 132], [12, '제2생활관', 68, 207],
  [13, '학생회관', 445, 147], [14, '웨슬리관', 565, 151], [15, '대운동장', 222, 306], [16, '정문', 298, 448],
  [17, '버스승강장', 371, 385], [18, '주차장', 325, 323],
];

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const smooth = (x) => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const lerpTable = (table, x) => {
  if (x <= table[0][0]) return table[0][1];
  for (let k = 1; k < table.length; k++) {
    if (x <= table[k][0]) return table[k - 1][1] + (table[k][1] - table[k - 1][1]) * (x - table[k - 1][0]) / (table[k][0] - table[k - 1][0]);
  }
  return table.at(-1)[1];
};
const ellipse = (cx, cy, rx, ry, n = 28, a0 = 0, a1 = Math.PI * 2) => Array.from({ length: n }, (_, k) => {
  const a = a0 + (a1 - a0) * k / (a1 - a0 >= Math.PI * 2 ? n : n - 1);
  return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
});

// ---- 시점과 투영
const homeCamera = new THREE.PerspectiveCamera(FOV, FRAME.w / FRAME.h, 1, 6000);
homeCamera.position.set(0, DIST * Math.sin(PITCH), DIST * Math.cos(PITCH));
homeCamera.lookAt(0, 0, 0);
homeCamera.updateMatrixWorld();
homeCamera.updateProjectionMatrix();
const pixelRay = (u, v) => new THREE.Vector3(u / FRAME.w * 2 - 1, 1 - v / FRAME.h * 2, .5).unproject(homeCamera).sub(homeCamera.position);
function unproject(u, v, y) {
  const ray = pixelRay(u, v);
  return homeCamera.position.clone().addScaledVector(ray, (y - homeCamera.position.y) / ray.y);
}

// 그림 좌표를 지나는 시선 위에서 건물 중심축에 가장 가까운 점: 기본 시점의 위치는 그대로 두고 돌려 봐도 건물에 붙어 있게 한다
function nearestOnPixelRay(u, v, center) {
  const ray = pixelRay(u, v), origin = homeCamera.position;
  const t = ((center.x - origin.x) * ray.x + (center.z - origin.z) * ray.z) / (ray.x * ray.x + ray.z * ray.z);
  return origin.clone().addScaledVector(ray, t);
}

// ---- GPS: 실제 좌표(미터, x 동쪽, z 남쪽)와 그림 픽셀을 기준점으로 잇는 박판 스플라인
const GEO = { lat: 37.2128208, lon: 126.9519139, x0: -246.08, x1: 246.42, z0: -292.4, z1: 292.6 };
const CONTROL_POINTS = [
  [164.5, -122.2, 79, 290],
  [158.7, -50.0, 82, 226],
  [175.7, -94.3, 36, 246],
  [152.0, -80.9, 120, 265],
  [110.5, 33.5, 250, 202],
  [176.6, 10.6, 85, 176],
  [109.7, 124.8, 215, 147],
  [106.7, 85.9, 200, 154],
  [56.2, 144.5, 312, 86],
  [64.7, 195.4, 251, 52],
  [91.9, 221.9, 165, 56],
  [76.8, 35.4, 271, 221],
  [40.0, 9.4, 315, 244],
  [33.4, 68.6, 316, 200],
  [-43.6, 59.0, 450, 188],
  [-125.6, 11.1, 590, 180],
  [38.6, -243.9, 345, 416],
  [88.0, -61.3, 227, 277],
  [28.0, -82.0, 278, 290],
  [64.7, -184.7, 233, 350],
  [126.7, -162.0, 158, 334],
  [-24.7, 98.0, 398, 190],
  [-123.3, 145.3, 530, 130],
  [-186.7, 41.3, 690, 170],
  [-148.0, -26.7, 640, 222],
  [103.3, -223.3, 175, 440],
  [236.7, -114.7, -8, 305],
  [-4.7, -160.0, 394, 335],
  [20.0, -65.3, 384, 243],
  [52.0, -226.7, 318, 412],
  [146.7, -136.7, 122, 318],
  [80.0, -216.7, 225, 405],
];
const SMOOTHING = 120;

function solveLinear(matrix, values) {
  const n = values.length, rows = matrix.map((row, k) => [...row, values[k]]);
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(rows[r][col]) > Math.abs(rows[pivot][col])) pivot = r;
    [rows[col], rows[pivot]] = [rows[pivot], rows[col]];
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = rows[r][col] / rows[col][col];
      for (let c = col; c <= n; c++) rows[r][c] -= factor * rows[col][c];
    }
  }
  return rows.map((row, k) => row[n] / row[k]);
}
function createGeoMapper() {
  const n = CONTROL_POINTS.length, size = n + 3;
  const kernel = (r) => (r < 1e-9 ? 0 : r * r * Math.log(r));
  const matrix = Array.from({ length: size }, () => new Array(size).fill(0));
  CONTROL_POINTS.forEach(([x, z], i) => {
    CONTROL_POINTS.forEach(([x2, z2], j) => { matrix[i][j] = kernel(Math.hypot(x - x2, z - z2)) + (i === j ? SMOOTHING : 0); });
    [1, x, z].forEach((value, k) => { matrix[i][n + k] = value; matrix[n + k][i] = value; });
  });
  const weights = (axis) => solveLinear(matrix, [...CONTROL_POINTS.map((p) => p[axis]), 0, 0, 0]);
  const wu = weights(2), wv = weights(3);
  const evaluate = (w, x, z) => w[n] + w[n + 1] * x + w[n + 2] * z + CONTROL_POINTS.reduce((sum, [px, pz], i) => sum + w[i] * kernel(Math.hypot(x - px, z - pz)), 0);
  return (x, z) => [evaluate(wu, x, z), evaluate(wv, x, z)];
}

// ---- 지형
const RIDGE = [[-500, -160], [0, -70], [150, -32], [240, 0], [300, 15], [350, 26], [400, 40], [450, 49], [500, 54], [550, 57], [600, 60], [650, 62], [709, 66], [1250, 90]];
const ridgeAt = (u) => lerpTable(RIDGE, u);
function heightAt(u, v) {
  const ridge = 72 * smooth(1 - (v - ridgeAt(u)) / 240);
  const mound = 18 * Math.exp(-(((u - 505) / 120) ** 2) - (((v - 285) / 78) ** 2));
  const ripple = 1.4 * Math.sin(u * .05 + v * .03) * Math.sin(v * .07 - u * .02) * smooth((240 - v) / 140);
  return ridge + mound + ripple;
}

function buildTerrain(texture) {
  const cols = 330, rows = 230, skirt = 6;
  const total = rows + skirt + 1;
  const positions = new Float32Array((cols + 1) * total * 3), uvs = new Float32Array((cols + 1) * total * 2), indices = [];
  for (let c = 0; c <= cols; c++) {
    const u = U0 + (U1 - U0) * c / cols, top = ridgeAt(u);
    let ridgePoint = null;
    for (let r = 0; r <= rows; r++) {
      const v = top + (V1 - top) * (r / rows);
      const p = unproject(u, v, heightAt(u, v));
      if (r === 0) ridgePoint = p;
      const k = (skirt + r) * (cols + 1) + c;
      positions.set([p.x, p.y, p.z], k * 3);
      uvs.set([(u - U0) / (U1 - U0), (v - V0) / (V1 - V0)], k * 2);
    }
    for (let s = 1; s <= skirt; s++) {
      const k = (skirt - s) * (cols + 1) + c;
      positions.set([ridgePoint.x, ridgePoint.y - s * 16, ridgePoint.z - s * 20], k * 3);
      uvs.set([(u - U0) / (U1 - U0), (top - V0) / (V1 - V0)], k * 2);
    }
  }
  for (let r = 0; r < total - 1; r++) {
    for (let c = 0; c < cols; c++) {
      const k = r * (cols + 1) + c;
      indices.push(k, k + cols + 1, k + 1, k + 1, k + cols + 1, k + cols + 2);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ map: texture }));
  mesh.receiveShadow = true;
  return mesh;
}

// ---- 바닥 그림 (숲, 도로, 광장, 운동장)
const CREAM = '#fffef5', SAND = '#f5dfb9', FOREST = '#6fae35', GRASS = '#8fca55';
const MASK_NONE = '#000', MASK_FOREST = '#f00', MASK_BUSH = '#0f0';

function createPainter() {
  const canvas = document.createElement('canvas');
  canvas.width = (U1 - U0) * TEX_SCALE;
  canvas.height = (V1 - V0) * TEX_SCALE;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(TEX_SCALE, 0, 0, TEX_SCALE, -U0 * TEX_SCALE, -V0 * TEX_SCALE);
  ctx.lineCap = ctx.lineJoin = 'round';

  const mask = document.createElement('canvas');
  mask.width = U1 - U0;
  mask.height = V1 - V0;
  const maskCtx = mask.getContext('2d', { willReadFrequently: true });
  maskCtx.setTransform(1, 0, 0, 1, -U0, -V0);
  maskCtx.lineCap = maskCtx.lineJoin = 'round';

  const trace = (c, pts, close = true) => {
    c.beginPath();
    pts.forEach(([x, y], k) => (k ? c.lineTo(x, y) : c.moveTo(x, y)));
    if (close) c.closePath();
  };
  const random = rng(77);
  function leafPattern(density, palette) {
    const tile = document.createElement('canvas');
    tile.width = tile.height = 384;
    const c = tile.getContext('2d');
    for (let k = 0; k < 384 * 384 / 9 * density; k++) {
      c.fillStyle = palette[random() * palette.length | 0];
      c.beginPath();
      c.ellipse(random() * 384, random() * 384, 1.5 + random() * 2.7, .9 + random() * 1.5, random() * 3, 0, 7);
      c.fill();
    }
    const pattern = ctx.createPattern(tile, 'repeat');
    pattern.setTransform(new DOMMatrix().scale(1 / TEX_SCALE));
    return pattern;
  }
  const forestLeaves = leafPattern(.55, ['#5c9c2f', '#83bf45', '#4a8c2c', '#a4d35f']);
  const bushLeaves = leafPattern(1.3, ['#3f8a2a', '#5eab35', '#7cc045', '#2f7526']);

  return {
    canvas, maskCtx, ctx, trace,
    poly(pts, color, maskColor = MASK_NONE) {
      trace(ctx, pts); ctx.fillStyle = color; ctx.fill();
      trace(maskCtx, pts); maskCtx.fillStyle = maskColor; maskCtx.fill();
    },
    stroke(pts, width, color, maskColor = MASK_NONE) {
      trace(ctx, pts, false); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      trace(maskCtx, pts, false); maskCtx.strokeStyle = maskColor; maskCtx.lineWidth = width; maskCtx.stroke();
    },
    line(pts, width, color, dash = [], close = false) {
      trace(ctx, pts, close); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
    },
    fillOnly(pts, color) { trace(ctx, pts); ctx.fillStyle = color; ctx.fill(); },
    green(pts, kind = MASK_BUSH, base = '#4f9a30') {
      trace(ctx, pts); ctx.fillStyle = base; ctx.fill();
      trace(maskCtx, pts); maskCtx.fillStyle = kind; maskCtx.fill();
      if (kind !== MASK_NONE) {
        ctx.strokeStyle = base; ctx.lineWidth = 2.4; ctx.stroke();
        ctx.fillStyle = bushLeaves; ctx.fill();
      }
    },
    forestBase() {
      const gradient = ctx.createLinearGradient(0, -100, 500, 400);
      gradient.addColorStop(0, '#9ccb58');
      gradient.addColorStop(.5, FOREST);
      gradient.addColorStop(1, '#67a833');
      ctx.fillStyle = gradient;
      ctx.fillRect(U0, V0, U1 - U0, V1 - V0);
      maskCtx.fillStyle = MASK_FOREST;
      maskCtx.fillRect(U0, V0, U1 - U0, V1 - V0);
      ctx.fillStyle = forestLeaves;
      ctx.fillRect(U0, V0, U1 - U0, V1 - V0);
    },
  };
}

function paintGround(painter) {
  const { poly, stroke, line, fillOnly, green, forestBase } = painter;
  forestBase();

  // 흰 바닥: 아래쪽 도로, 오른쪽 아래 시가지, 언덕 위 평지
  poly([[U0, 268], [-10, 270], [14, 258], [14, 246], [58, 228], [92, 205], [120, 200], [170, 175], [240, 172], [300, 160], [345, 158], [378, 178], [395, 222], [384, 240], [396, 272], [415, 310], [418, 345], [400, 365], [452, 392], [470, 398], [520, 408], [560, 398], [625, 365], [709, 288], [U1, 200], [U1, V1], [U0, V1]], CREAM);
  poly([[66, 184], [72, 174], [150, 155], [175, 160], [115, 193]], CREAM);
  poly([[102, 61], [122, 53], [285, 54], [288, 66], [222, 70], [160, 80], [105, 69]], CREAM);
  poly([[150, 165], [150, 120], [235, 125], [305, 138], [312, 150], [262, 172], [205, 178]], CREAM);
  stroke([[216, 63], [228, 78], [252, 104], [300, 130], [350, 152], [395, 182]], 21, CREAM);
  poly([[418, 205], [425, 172], [440, 145], [473, 128], [500, 122], [540, 126], [620, 142], [673, 157], [697, 173], [697, 182], [660, 210], [625, 232], [603, 233], [640, 208], [622, 218], [535, 178], [505, 172], [482, 184], [472, 206], [445, 212]], CREAM);
  stroke([[395, 205], [430, 186]], 24, CREAM);

  // 언덕 위 공원: 하트 모양 산책로
  const heartLawn = [[475, 252], [455, 258], [446, 273], [455, 290], [472, 307], [490, 322], [510, 330], [535, 320], [552, 308], [561, 290], [553, 272], [530, 258], [505, 250], [490, 248]];
  green(heartLawn, MASK_NONE, '#86c653');
  stroke([...heartLawn, heartLawn[0]], 5, '#efdcb6');
  stroke([[492, 250], [487, 265], [478, 280], [472, 307]], 3.5, '#efdcb6');
  stroke([[494, 262], [510, 268], [530, 277], [556, 288]], 3.5, '#efdcb6');
  stroke([[384, 241], [405, 238], [416, 247], [436, 245], [455, 244], [478, 238], [494, 234], [522, 236]], 3.2, '#efdcb6');
  for (const pts of [ellipse(464, 278, 7, 10, 12), ellipse(517, 300, 15, 12, 14), ellipse(495, 300, 6, 9, 10), ellipse(540, 282, 7, 5, 10)]) green(pts);
  poly(ellipse(534, 240, 15, 11, 18), '#f4e2bd');
  green(ellipse(497, 265, 9, 7, 16), MASK_NONE, '#3f8a2a');
  green(ellipse(534, 239, 5, 3.5, 12), MASK_NONE, '#5eab35');

function facadeTexture({ wall, glass, line, winW = .56, winH = .52, band = null, sketch = false }) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const c = canvas.getContext('2d');
  c.fillStyle = wall;
  c.fillRect(0, 0, 64, 64);
  if (band) { c.fillStyle = band; c.fillRect(0, 54, 64, 10); }
  const w = 64 * winW, h = 64 * winH, x = (64 - w) / 2, y = (56 - h) / 2;
  if (!sketch) { c.fillStyle = glass; c.fillRect(x, y, w, h); }
  c.strokeStyle = line;
  c.lineWidth = sketch ? 4 : 3;
  c.strokeRect(x, y, w, h);
  c.beginPath(); c.moveTo(32, y); c.lineTo(32, y + h); c.stroke();
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

function getLook(name) {

}

function pixelsPerMeter(u, v, y) {
  const a = unproject(u, v, y), b = a.clone().setY(y + 10);
  return (b.project(homeCamera).y - a.project(homeCamera).y) / 2 * FRAME.h / 10;
}

class Building {
  constructor(parent, id, base, baseY) {
    this.group = new THREE.Group();
    this.group.userData.placeId = id;
    this.baseY = baseY ?? heightAt(...base);
    this.pxPerM = pixelsPerMeter(base[0], base[1], this.baseY);
    parent.add(this.group);
  }
  y(px) { return this.baseY + px / this.pxPerM; }
  world(pts) { return pts.map(([u, v]) => unproject(u, v, this.baseY)); }

  // 그림 좌표 외곽선을 from~to(그림 픽셀 높이)로 세운다
  prism(pts, from, to, lookName, { skirt = from === 0 ? 16 : 0, clear = from === 0 } = {}) {
    const look = getLook(lookName);
    if (clear) footprints.push(pts);
    const ring = this.world(pts);
    let area = 0;
    ring.forEach((a, k) => { const b = ring[(k + 1) % ring.length]; area += a.x * b.z - b.x * a.z; });
    if (area < 0) ring.reverse();
    const y0 = this.y(from) - skirt, y1 = this.y(to);
    const positions = [], uvs = [];
    let run = 0;
    ring.forEach((a, k) => {
      const b = ring[(k + 1) % ring.length], len = Math.hypot(b.x - a.x, b.z - a.z);
      const u0 = run / look.bay, u1 = (run + len) / look.bay, t0 = -skirt / look.floor, t1 = (y1 - y0 - skirt) / look.floor;
      positions.push(a.x, y0, a.z, a.x, y1, a.z, b.x, y0, b.z, b.x, y0, b.z, a.x, y1, a.z, b.x, y1, b.z);
      uvs.push(u0, t0, u0, t1, u1, t0, u1, t0, u0, t1, u1, t1);
      run += len;
    });
    const walls = new THREE.BufferGeometry();
    walls.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    walls.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    walls.computeVertexNormals();
    const wallMesh = new THREE.Mesh(walls, look.wallMat);
    wallMesh.castShadow = wallMesh.receiveShadow = true;

    const contour = ring.map((p) => new THREE.Vector2(p.x, p.z));
    const roofPositions = [];
    for (const [i, j, k] of THREE.ShapeUtils.triangulateShape(contour, [])) {
      for (const p of [ring[i], ring[k], ring[j]]) roofPositions.push(p.x, y1, p.z);
    }
    const roof = new THREE.BufferGeometry();
    roof.setAttribute('position', new THREE.Float32BufferAttribute(roofPositions, 3));
    roof.computeVertexNormals();
    const roofMesh = new THREE.Mesh(roof, look.roofMat);
    roofMesh.castShadow = true;

    const edges = [];
    const smoothOutline = ring.length > 10;
    ring.forEach((a, k) => {
      const b = ring[(k + 1) % ring.length];
      edges.push(a.x, y1, a.z, b.x, y1, b.z);
      if (!smoothOutline) edges.push(a.x, y0, a.z, a.x, y1, a.z);
    });
    const outline = new THREE.BufferGeometry();
    outline.setAttribute('position', new THREE.Float32BufferAttribute(edges, 3));
    this.group.add(wallMesh, roofMesh, new THREE.LineSegments(outline, look.edgeMat));
    return this;
  }

  // 네 꼭짓점 위에 모임지붕을 얹는다 (a-b가 긴 변)
  hip(pts, top, rise, lookName, inset = .5) {
    const look = getLook(lookName);
    const [a, b, c, d] = this.world(pts);
    const y = this.y(top), ridgeY = this.y(top + rise);
    const center = a.clone().add(b).add(c).add(d).multiplyScalar(.25);
    const r1 = a.clone().add(d).multiplyScalar(.5).lerp(center, inset), r2 = b.clone().add(c).multiplyScalar(.5).lerp(center, inset);
    const low = (p) => [p.x, y, p.z], high = (p) => [p.x, ridgeY, p.z];
    const positions = [
      low(a), low(b), high(r2), low(a), high(r2), high(r1),
      low(b), low(c), high(r2),
      low(c), low(d), high(r1), low(c), high(r1), high(r2),
      low(d), low(a), high(r1),
    ].flat();
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.computeVertexNormals();
    const mesh = new THREE.Mesh(geometry, look.roofMat);
    mesh.castShadow = true;
    this.group.add(mesh, new THREE.LineSegments(new THREE.EdgesGeometry(geometry, 12), look.edgeMat));
    return this;
  }

  // 앞줄과 뒷줄 사이를 계단식 관람석으로 채운다
  stands(front, back, steps, rise, lookName) {
    const mix = (t) => front.map((p, k) => [p[0] + (back[k][0] - p[0]) * t, p[1] + (back[k][1] - p[1]) * t]);
    for (let s = 0; s < steps; s++) {
      this.prism([...mix(s / steps), ...mix(1).reverse()], s === 0 ? 0 : rise * s / steps - .5, rise * (s + 1) / steps, lookName, { clear: s === 0 });
    }
    return this;
  }
}

function inset(pts, t) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  return pts.map(([x, y]) => [x + (cx - x) * t, y + (cy - y) * t]);
}

function buildBackdrop(scene) {
  const left = -300, right = 1010, top = -120, bottom = 90, scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = (right - left) * scale;
  canvas.height = (bottom - top) * scale;
  const c = canvas.getContext('2d');
  c.setTransform(scale, 0, 0, scale, -left * scale, -top * scale);
  const towers = [[452, 15, 8], [462, 18, 16], [475, 25, 10], [486, 26, 11], [496, 15, 14], [508, 22, 11], [516, 23, 14], [529, 27, 8], [532, 15, 16], [548, 26, 12], [557, 22, 12], [564, 20, 14], [578, 28, 10], [583, 30, 15], [597, 32, 9], [603, 37, 12], [613, 35, 10], [621, 38, 12], [634, 30, 12], [645, 34, 9], [652, 38, 12], [666, 28, 13], [679, 37, 9], [686, 34, 14], [699, 33, 10], [708, 40, 14], [722, 34, 12], [736, 42, 14], [752, 38, 12], [768, 46, 16]];
  for (const [x, y, w] of towers) {
    c.fillStyle = 'rgba(250,250,244,.92)';
    c.fillRect(x, y, w, bottom - y);
    c.strokeStyle = 'rgba(160,175,178,.8)';
    c.lineWidth = .35;
    c.strokeRect(x, y, w, bottom - y);
    for (let yy = y + 3; yy < 70; yy += 3) { c.beginPath(); c.moveTo(x + 1, yy); c.lineTo(x + w - 1, yy); c.stroke(); }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const at = (u, v) => homeCamera.position.clone().addScaledVector(pixelRay(u, v).normalize(), DIST * 2.4);
  const a = at(left, top), bb = at(right, top), cc = at(left, bottom), d = at(right, bottom);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([...a, ...bb, ...cc, ...d].map((n) => n), 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 0, 0, 1, 0], 2));
  geometry.setIndex([0, 2, 1, 1, 2, 3]);
  scene.add(new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, fog: false })));
}

function forestShade(u, v) {
  const valley = .13 * Math.exp(-(((u - 395) / 75) ** 2) - (((v - 135) / 42) ** 2));
  const band = .12 * Math.exp(-(((u - 700) / 300) ** 2) - (((v - 105) / 32) ** 2));
  const edge = .17 * Math.exp(-((((u - 620) * .62 + (v - 365) * .78) / 12) ** 2)) * smooth((u - 520) / 40);
  return valley + band + edge;
}
const TREE_ROWS = [
  [[103, 68], [130, 75], [160, 81]], [[72, 186], [100, 191], [140, 180]], [[108, 212], [170, 190], [222, 172]],
  [[698, 186], [662, 217], [628, 239]], [[303, 374], [345, 361], [378, 342]], [[238, 346], [262, 320]], [[268, 318], [288, 292]],

function buildTrees(scene, painter) {
  for (const pts of footprints) {
    painter.trace(painter.maskCtx, pts);
    painter.maskCtx.fillStyle = MASK_NONE;
    painter.maskCtx.fill();
    painter.maskCtx.strokeStyle = MASK_NONE;
    painter.maskCtx.lineWidth = 2;
    painter.maskCtx.stroke();
  }
  const width = U1 - U0, height = V1 - V0;
  const pixels = painter.maskCtx.getImageData(0, 0, width, height).data;
  const random = rng(19);
  const pines = [], bushes = [];
  for (let v = V0; v < V1; v += 3) {
    for (let u = U0; u < U1; u += 3) {
      const x = u + random() * 3, y = v + random() * 3;
      if (y < ridgeAt(x) + 1) continue;
      const k = ((y - V0 | 0) * width + (x - U0 | 0)) * 4;
      const inFrame = x > -30 && x < 740 && y < 500;
      const above = ((Math.max(y - 5, V0) - V0 | 0) * width + (x - U0 | 0)) * 4;
      if (pixels[k] > 128 && pixels[above] > 128) { if (inFrame ? random() < .8 : random() < .3) pines.push([x, y]); }
      else if (pixels[k + 1] > 128 && random() < .95) bushes.push([x, y]);
    }
  }

  const shaded = (geometry, bottom, top) => {
    const box = new THREE.Box3().setFromBufferAttribute(geometry.attributes.position);
    const colors = [], p = geometry.attributes.position, low = new THREE.Color(bottom), high = new THREE.Color(top), mixed = new THREE.Color();
    for (let k = 0; k < p.count; k++) {
      mixed.copy(low).lerp(high, (p.getY(k) - box.min.y) / (box.max.y - box.min.y));
      colors.push(mixed.r, mixed.g, mixed.b);
    }
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    return geometry;
  };
  const place = (list, geometry, heightMin, heightRange, widthScale, hue, sat, light) => {
    const mesh = new THREE.InstancedMesh(geometry, new THREE.MeshLambertMaterial({ vertexColors: true }), list.length);
    const matrix = new THREE.Matrix4(), rotation = new THREE.Quaternion(), position = new THREE.Vector3(), scale = new THREE.Vector3(), color = new THREE.Color();
    list.forEach(([u, v], k) => {
      const s = heightMin + random() * heightRange;
      const p = unproject(u, v, heightAt(u, v));
      matrix.compose(position.set(p.x, p.y, p.z), rotation, scale.set(s * widthScale, s, s * widthScale));
      mesh.setMatrixAt(k, matrix);
      const sunny = smooth(1 - (u * .7 + v) / 520) * .2 - forestShade(u, v);   // 그림은 왼쪽 위로 갈수록 밝다
      mesh.setColorAt(k, color.setHSL(hue + random() * .04 - sunny * .15, sat + random() * .1, light + sunny + random() * .1));
    });
    scene.add(mesh);
  };
  place(pines, shaded(new THREE.ConeGeometry(1, 1, 5, 1, true).translate(0, .5, 0), '#5f9f35', '#f2ffc0'), 4.5, 3, .3, .235, .55, .55);
  place(bushes, shaded(new THREE.IcosahedronGeometry(.5, 0).translate(0, .5, 0), '#2f7a2c', '#d4f08c'), 3.2, 3, .95, .27, .5, .42);
  const rowTrees = TREE_ROWS.flatMap((row) => row.slice(1).flatMap((end, k) => {
    const start = row[k], n = Math.ceil(Math.hypot(end[0] - start[0], end[1] - start[1]) / 5.5);
    return Array.from({ length: n }, (_, t) => [start[0] + (end[0] - start[0]) * t / n, start[1] + (end[1] - start[1]) * t / n]);
  }));
  place(rowTrees, shaded(new THREE.ConeGeometry(1, 1, 7, 1, true).translate(0, .5, 0), '#2d6e28', '#a9dc66'), 8, 3, .33, .28, .55, .38);
  return { pines: pines.length, bushes: bushes.length };
}

  const anchorHeight = (id) => {

  };
  const itemsEl = document.getElementById('items');
  const places = PLACES.map(([id, name, u, v]) => {
    const box = anchorHeight(id);
    const focus = box ? box.getCenter(new THREE.Vector3()) : unproject(u, v, heightAt(u, v));

    const marker = document.createElement('button');

    marker.type = 'button';
    marker.textContent = id;
    marker.title = name;
    mapEl.append(marker);
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.innerHTML = `<span class="num">${id}</span><span></span>`;
    button.lastChild.textContent = name;
    item.append(button);
    itemsEl.append(item);
    const place = { id, name, u, v, anchor, focus, marker, button };
    marker.addEventListener('click', () => select(place));
    button.addEventListener('click', () => select(place));
    return place;
  });

  let selected = null, flight = null;
  function highlight(place) {
    selected?.marker.classList.remove('on');
    selected?.button.classList.remove('on');
    selected = place;
    place?.marker.classList.add('on');
    place?.button.classList.add('on');
  }
  function select(place) {
    highlight(place);
    locator.stopFollowing();
    const direction = homeCamera.position.clone().sub(place.focus).normalize();
    direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(-14));
    flight = { target: place.focus.clone(), camera: place.focus.clone().addScaledVector(direction, 190) };
  }
  document.getElementById('home').addEventListener('click', () => {
    highlight(null);
    locator.stopFollowing();
    flight = { target: new THREE.Vector3(), camera: homeCamera.position.clone() };
  });

  const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  let down = null;
  renderer.domElement.addEventListener('pointerdown', (event) => { down = [event.clientX, event.clientY]; flight = null; locator.stopFollowing(); });
  renderer.domElement.addEventListener('wheel', () => { flight = null; }, { passive: true });
  renderer.domElement.addEventListener('pointerup', (event) => {
    if (!down || Math.hypot(event.clientX - down[0], event.clientY - down[1]) > 5) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.set((event.clientX - rect.left) / rect.width * 2 - 1, -(event.clientY - rect.top) / rect.height * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    for (const hit of raycaster.intersectObjects(campus.children, true)) {
      if (hit.object.isLineSegments) continue;
      const id = hit.object.parent.userData.placeId;
      const place = places.find((p) => p.id === id || `podium${p.id}` === id || `stand${p.id}a` === id || `stand${p.id}b` === id || `stand${p.id}c` === id);

    const fit = Math.max(1, FRAME.w / FRAME.h / camera.aspect);

    const button = document.getElementById('locate'), statusEl = document.getElementById('gps-status');

    const metersPerLat = 111132.92 - 559.82 * Math.cos(2 * phi) + 1.175 * Math.cos(4 * phi);
    const metersPerLon = 111412.84 * Math.cos(phi) - 93.5 * Math.cos(3 * phi);
    const worldAt = (x, z) => { const [u, v] = toPixel(x, z); return unproject(u, v, heightAt(u, v)); };
    const probe = new THREE.Vector3();
    function groundY(x, z) {
      let y = 0;
      for (let k = 0; k < 4; k++) {
        probe.set(x, y, z).project(homeCamera);
        y = heightAt((probe.x + 1) / 2 * FRAME.w, (1 - probe.y) / 2 * FRAME.h);
      }
      return y;
    }

    // 지형을 따라 휘는 원판 (오차 범위, 접지 그림자)
    function createDrape(color, opacity) {
      const segments = 36, rings = 4, geometry = new THREE.BufferGeometry(), index = [];
      geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array((1 + segments * rings) * 3), 3));
      for (let s = 0; s < segments; s++) {
        const next = (s + 1) % segments;
        index.push(0, 1 + next, 1 + s);
        for (let r = 0; r < rings - 1; r++) {
          const a = 1 + r * segments + s, b = 1 + r * segments + next;
          index.push(a, b, a + segments, b, b + segments, a + segments);
        }
      }
      geometry.setIndex(index);
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
      mesh.frustumCulled = false;
      mesh.renderOrder = 3;
      mesh.visible = false;
      scene.add(mesh);
      mesh.fit = (center, radius) => {
        const position = geometry.attributes.position;
        position.setXYZ(0, center.x, groundY(center.x, center.z) + .7, center.z);
        for (let r = 0; r < rings; r++) {
          for (let s = 0; s < segments; s++) {
            const distance = radius * (r + 1) / rings, angle = s / segments * Math.PI * 2;
            const x = center.x + Math.cos(angle) * distance, z = center.z + Math.sin(angle) * distance;
            position.setXYZ(1 + r * segments + s, x, groundY(x, z) + .7, z);
          }
        }
        position.needsUpdate = true;
      };
      return mesh;
    }
    const accuracyDisc = createDrape('#2f7bff', .16), contactShadow = createDrape('#10203a', .34);

    // 땅에 서 있는 3D 핀: 건물 뒤로 가면 가려지고, 가려진 동안에는 흐리게 비친다

      button.textContent = watchId === null ? '내 위치' : following || !hasFix ? '위치 끄기' : '내 위치로';
    }
    function hide() {
      hasFix = false;
      pin.visible = accuracyDisc.visible = contactShadow.visible = false;
    }
    function stop() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      following = false;
      hide();
      refreshButton();
    }
    function flyToMe() {
      following = true;
      flight = { target: target.clone(), camera: target.clone().addScaledVector(viewDirection, 300) };
      refreshButton();
    }
    function onPosition({ coords }) {
      const x = (coords.longitude - GEO.lon) * metersPerLon, z = (GEO.lat - coords.latitude) * metersPerLat;
      if (x < GEO.x0 || x > GEO.x1 || z < GEO.z0 || z > GEO.z1) {
        hide();
        following = false;
        refreshButton();
        say(`캠퍼스 지도 밖에 있습니다. 지도 중심까지 약 ${(Math.hypot(x, z) / 1000).toFixed(1)} km`);
        return;
      }
      accuracy = coords.accuracy;
      target.copy(worldAt(x, z));
      accuracyRadius = Math.min(worldAt(x + accuracy, z).distanceTo(target), 40);
      say(`내 위치 정확도 약 ${Math.round(accuracy)} m`);
      if (!hasFix) {
        hasFix = true;
        shown.copy(target);
        pin.visible = accuracyDisc.visible = contactShadow.visible = true;
        flyToMe();
      }
    }
    function onError(error) {
      if (error.code === error.PERMISSION_DENIED) {
        stop();
        say('위치 권한이 거부되었습니다. 브라우저 설정에서 이 사이트의 위치를 허용해 주세요.');
      } else if (error.code === error.POSITION_UNAVAILABLE) {
        say('위치를 찾을 수 없습니다. 기기의 위치 서비스가 켜져 있는지 확인해 주세요.');
      } else {
        say('위치 신호를 기다리는 중입니다.');
      }
    }
    button.addEventListener('click', () => {
      if (!window.isSecureContext || !navigator.geolocation) {
        say('이 주소에서는 위치를 쓸 수 없습니다. https 주소로 접속해 주세요.');
      } else if (watchId === null) {
        say('위치를 찾는 중입니다.');
        watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
        refreshButton();
      } else if (hasFix && !following) {
        flyToMe();
      } else {
        stop();
        say(null);
      }
    });

    return {
      stopFollowing() {
        if (!following) return;
        following = false;
        refreshButton();
      },
      update() {
        if (!hasFix) return;
        const before = shown.clone();
        shown.lerp(target, .12);
        if (following) {
          const delta = shown.clone().sub(before);
          (flight?.target ?? controls.target).add(delta);
          (flight?.camera ?? camera.position).add(delta);
        }
        // 화면에서 거의 같은 크기로 보이도록 카메라 거리에 맞춰 키운다
        const worldPerPixel = 2 * camera.position.distanceTo(shown) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / mapEl.clientHeight;
        const size = worldPerPixel * HEAD_PX;
        pin.position.copy(shown);
        pin.scale.setScalar(size);
        accuracyDisc.fit(shown, Math.max(accuracyRadius, size * 1.5));
        contactShadow.fit(shown, size * .85);
      },
      state: () => {
        const p = shown.clone().project(homeCamera);
        return { hasFix, following, watching: watchId !== null, u: (p.x + 1) / 2 * FRAME.w, v: (1 - p.y) / 2 * FRAME.h, accuracy, y: shown.y, ground: groundY(shown.x, shown.z), headPx: HEAD_PX * 2, target: target.toArray() };
      },
    };
  }

  const projected = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    if (flight) {
      controls.target.lerp(flight.target, .09);
      camera.position.lerp(flight.camera, .09);
      if (camera.position.distanceTo(flight.camera) < .4) flight = null;
    }
    locator.update();
    controls.update();
    renderer.render(scene, camera);
    const { clientWidth: w, clientHeight: h } = mapEl;
    for (const { marker, anchor } of places) {
      projected.copy(anchor).project(camera);
      marker.style.visibility = projected.z < 1 ? 'visible' : 'hidden';
      marker.style.transform = `translate(${(projected.x + 1) / 2 * w}px, ${(1 - projected.y) / 2 * h}px) translate(-50%, -50%)`;
    }
  });

  window.campusTour = {
    camera, controls, places, locator,
    stats: () => ({ places: places.length, triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, selected: selected?.name ?? null, ...treeCount }),
  };
  document.body.dataset.ready = 'true';
}

try {
  main();
} catch (error) {
  console.error(error);
  const el = document.getElementById('error');
  el.hidden = false;
  el.textContent = `3D 모형을 만들지 못했습니다. (${error.message})`;
}
</script>
</body>
</html>
